<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Drill</title>
<style>
__DUO_CSS__

/* Page-specific composition. Anything reusable belongs in duo.css instead. */
* { box-sizing: border-box; }

/* One height for every screen, measured by fit(): the footer button must land on
   the same pixel whichever screen is showing. */
.duo-shell__body { height: var(--drill-body-h, 420px); }

.screen { flex: 1; display: flex; flex-direction: column; gap: var(--duo-space-3); }

.bytopic { list-style: none; padding: 0; margin: 0; }
.bytopic li {
  display: flex;
  justify-content: space-between;
  font-weight: var(--duo-weight-bold);
  padding: var(--duo-space-2) 0;
  border-bottom: var(--duo-stroke) solid var(--duo-border);
}

.miss { padding: var(--duo-space-2) 0; border-top: var(--duo-stroke) solid var(--duo-border); }
.trophy { font-size: var(--duo-space-6); line-height: 1; text-align: center; }
</style>
</head>
<body class="duo-page">

<main class="duo-shell" id="shell">
  <header class="duo-shell__header">
    <button class="duo-icon-btn duo-hidden" id="quitBtn" title="Back to lessons" aria-label="Back to lessons">&times;</button>
    <div class="duo-progress"><div class="duo-progress__fill" id="fill"></div></div>
  </header>

  <div class="duo-shell__body" id="body">

    <section class="screen" id="lessons">
      <div class="duo-stack duo-stack--tight">
        <h1 class="duo-title">Grammar Drill</h1>
        <div class="duo-muted" id="date"></div>
        <div class="duo-muted" style="font-size: var(--duo-text-sm)">Keyboard: number keys or &uarr;/&darr; pick an answer &middot; Enter checks &middot; Esc comes back here</div>
      </div>
      <div class="duo-row" id="chips"></div>
      <div class="duo-stack duo-stack--loose" id="topics"></div>
    </section>

    <section class="screen duo-hidden" id="quiz">
      <div class="duo-eyebrow" id="qtopic"></div>
      <h2 class="duo-prompt" id="qprompt"></h2>
      <div class="duo-stack" id="qbody"></div>
      <div class="duo-feedback duo-bottom duo-hidden" id="feedback"></div>
    </section>

    <section class="screen duo-hidden" id="result">
      <div class="trophy" id="trophy">&#127942;</div>
      <h2 class="duo-title" style="text-align: center" id="resultTitle"></h2>
      <div class="duo-row">
        <div class="duo-stat duo-stat--info">
          <div class="duo-stat__cap">Accuracy</div>
          <div class="duo-stat__value" id="statAcc"></div>
        </div>
        <div class="duo-stat">
          <div class="duo-stat__cap">First try</div>
          <div class="duo-stat__value" id="statScore"></div>
        </div>
      </div>
      <ul class="bytopic" id="byTopic"></ul>
      <div id="misses"></div>
    </section>

  </div>

  <footer class="duo-shell__footer">
    <button class="duo-btn duo-btn--ghost duo-hidden" id="secondaryBtn">Lessons</button>
    <button class="duo-btn duo-btn--wide" id="actionBtn">Start quiz</button>
  </footer>
</main>

<script>
const DATA = __DRILL_DATA__;

const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const topicLabel = id => (DATA.topics.find(t => t.id === id) || { label: id }).label;

/* ---------- lesson list ---------- */

$('date').textContent = DATA.date;
$('chips').innerHTML = DATA.topics
  .map(t => `<span class="duo-chip">${esc(t.label)} &middot; ${t.count ? t.count + ' logged' : 'new topic'}</span>`)
  .join('');
$('topics').innerHTML = DATA.topics.map(t => `
  <div class="duo-card duo-stack">
    <h2 class="duo-heading">${esc(t.label)}</h2>
    <p style="margin: 0">${esc(t.lesson.summary)}</p>
    <div class="duo-stack">${t.lesson.examples.map(e => `
      <div class="duo-stack duo-stack--tight">
        <div class="duo-fix">
          <span class="duo-fix__wrong">${esc(e.wrong)}</span>
          <span class="duo-fix__arrow">-&gt;</span>
          <span class="duo-fix__right">${esc(e.right)}</span>
        </div>
        <div class="duo-muted" style="font-size: var(--duo-text-sm)">${esc(e.note)}</div>
      </div>`).join('')}
    </div>
  </div>`).join('');

/* ---------- sizing ----------
 * The body height is fixed to the tallest question screen so the footer button
 * never moves across the quiz. Only questions are measured: the lessons and
 * result screens can be much taller, so they scroll inside the body (overflow-y)
 * rather than stretching every question to their height and leaving a dead gap.
 * Questions are measured with their feedback panel included, since that panel
 * appears inside the body.
 */

function screenMarkup(el, inner) {
  const c = el.cloneNode(inner === undefined);
  c.removeAttribute('id');
  c.classList.remove('duo-hidden');
  if (inner !== undefined) c.innerHTML = inner;
  return c.outerHTML;
}

function bodyHeightFor(markup) {
  const probe = $('body').cloneNode(false);
  probe.removeAttribute('id');
  probe.style.cssText =
    `position: absolute; left: 0; top: 0; visibility: hidden;` +
    `height: auto; width: ${$('body').offsetWidth}px;`;
  probe.innerHTML = markup;
  $('shell').appendChild(probe);
  const h = probe.scrollHeight;
  probe.remove();
  return h;
}

function questionMarkup(q) {
  return screenMarkup($('quiz'),
    `<div class="duo-eyebrow">${esc(topicLabel(q.topic))}</div>` +
    `<h2 class="duo-prompt">${esc(q.prompt)}</h2>` +
    `<div class="duo-stack">` +
      (q.type === 'choice'
        ? q.options.map((o, i) => `<button class="duo-option"><span class="duo-key">${i + 1}</span><span>${esc(o)}</span></button>`).join('')
        : '<input class="duo-input">') +
    `</div>` +
    `<div class="duo-feedback duo-bottom">` +
      `<div class="duo-feedback__title">x Not quite</div>` +
      `<div class="duo-feedback__answer">${esc(q.type === 'choice' ? q.options[q.answer] : q.answers[0])}</div>` +
      `<div class="duo-feedback__note">${esc(q.explain)}</div>` +
    `</div>`);
}

function fit() {
  let need = 0;
  DATA.questions.forEach(q => { need = Math.max(need, bodyHeightFor(questionMarkup(q))); });
  const shell = $('shell');
  const chrome = shell.offsetHeight - $('body').offsetHeight;
  const pagePad = 2 * parseFloat(getComputedStyle(document.body).paddingTop);
  const avail = window.innerHeight - chrome - pagePad;
  document.documentElement.style.setProperty(
    '--drill-body-h', `${Math.max(240, Math.min(need, avail))}px`);
}

/* ---------- quiz ---------- */

// queue holds question indices still to ask; a missed question is pushed back on
// so it returns later in the same run. retired = answered right at least once,
// which is what the progress bar measures (the queue length is not fixed).
let queue = [], current = -1, retired = new Set(), firstTry = new Map(), misses = [];
let selected = -1, phase = 'start', enterLocked = false;

const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const normalize = s => s.toLowerCase().replace(/[.!?]+\s*$/, '').replace(/\s+/g, ' ').trim();

function show(screen) {
  ['lessons', 'quiz', 'result'].forEach(id => $(id).classList.toggle('duo-hidden', id !== screen));
  $('quitBtn').classList.toggle('duo-hidden', screen !== 'quiz');
  $('body').scrollTop = 0;
}

function setAction(label, { danger = false, disabled = false, secondary = false } = {}) {
  const btn = $('actionBtn');
  btn.textContent = label;
  btn.className = 'duo-btn duo-btn--wide' + (danger ? ' duo-btn--danger' : '');
  btn.disabled = disabled;
  $('secondaryBtn').classList.toggle('duo-hidden', !secondary);
}

function setProgress(pct) { $('fill').style.width = `${pct}%`; }

function toLessons() {
  show('lessons');
  setProgress(0);
  phase = 'start';
  setAction('Start quiz');
}

function startQuiz() {
  queue = shuffle(DATA.questions.map((_, i) => i));
  retired = new Set(); firstTry = new Map(); misses = [];
  nextQuestion();
}

function nextQuestion() {
  if (!queue.length) return showResult();
  show('quiz');
  current = queue.shift();
  selected = -1;
  phase = 'answer';
  const q = DATA.questions[current];
  setProgress(Math.round(100 * retired.size / DATA.questions.length));
  $('qtopic').textContent = topicLabel(q.topic);
  $('qprompt').textContent = q.prompt;
  $('feedback').classList.add('duo-hidden');
  setAction('Check', { disabled: true });

  const body = $('qbody');
  body.innerHTML = '';
  if (q.type === 'choice') {
    q.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'duo-option';
      const key = document.createElement('span');
      key.className = 'duo-key';
      key.textContent = i + 1;
      const label = document.createElement('span');
      label.textContent = opt;
      b.append(key, label);
      b.onclick = () => select(i, body);
      body.appendChild(b);
    });
  } else {
    const inp = document.createElement('input');
    inp.className = 'duo-input';
    inp.id = 'rewriteInput';
    inp.placeholder = 'Type the corrected sentence';
    inp.oninput = () => { $('actionBtn').disabled = !inp.value.trim(); };
    body.appendChild(inp);
    inp.focus();
  }
}

function select(i, body) {
  selected = i;
  [...body.children].forEach((b, j) => b.classList.toggle('is-selected', j === i));
  $('actionBtn').disabled = false;
}

function check() {
  const q = DATA.questions[current];
  let ok, given;
  if (q.type === 'choice') {
    given = q.options[selected];
    ok = selected === q.answer;
    [...$('qbody').children].forEach((b, j) => {
      b.disabled = true;
      b.classList.remove('is-selected');
      if (j === q.answer) b.classList.add('is-correct');
      else if (j === selected) b.classList.add('is-wrong');
    });
  } else {
    const inp = $('rewriteInput');
    given = inp.value;
    ok = q.answers.some(a => normalize(a) === normalize(given));
    inp.disabled = true;
  }

  if (!firstTry.has(current)) {
    firstTry.set(current, ok);
    if (!ok) misses.push({ q, given });
  }
  if (ok) retired.add(current);
  else queue.push(current);

  const model = q.type === 'choice' ? q.options[q.answer] : q.answers[0];
  const fb = $('feedback');
  fb.className = 'duo-feedback duo-bottom' + (ok ? '' : ' duo-feedback--bad');
  fb.innerHTML =
    `<div class="duo-feedback__title">${ok ? '&#10004; Nice!' : '&#10006; Not quite'}</div>` +
    (ok ? '' : `<div class="duo-feedback__answer">${esc(model)}</div>`) +
    `<div class="duo-feedback__note">${esc(q.explain)}</div>`;

  setAction(queue.length ? 'Continue' : 'See result', { danger: !ok });
  phase = 'continue';
  // A held Enter would otherwise fire Check and Continue back to back, wiping the
  // feedback before it can be read. Unlock only on the next keyup.
  enterLocked = true;
  setProgress(Math.round(100 * retired.size / DATA.questions.length));
}

function showResult() {
  show('result');
  setProgress(100);
  phase = 'retry';
  setAction('Try again', { secondary: true });

  const total = DATA.questions.length;
  const good = [...firstTry.values()].filter(Boolean).length;
  const pct = Math.round(100 * good / total);
  $('statAcc').textContent = `${pct}%`;
  $('statScore').textContent = `${good} / ${total}`;
  $('trophy').innerHTML = pct === 100 ? '&#127942;' : pct >= 60 ? '&#127881;' : '&#128170;';
  $('resultTitle').textContent = pct === 100 ? 'Flawless' : pct >= 60 ? 'Lesson complete' : 'Keep drilling';

  const per = {};
  DATA.questions.forEach((q, i) => {
    if (!firstTry.has(i)) return;
    per[q.topic] = per[q.topic] || { good: 0, total: 0 };
    per[q.topic].total++;
    if (firstTry.get(i)) per[q.topic].good++;
  });
  $('byTopic').innerHTML = Object.entries(per)
    .map(([t, s]) => `<li><span>${esc(topicLabel(t))}</span><span>${s.good} / ${s.total}</span></li>`).join('');

  $('misses').innerHTML = misses.length === 0 ? '' :
    `<h3 class="duo-heading">Review</h3>` + misses.map(m => {
      const model = m.q.type === 'choice' ? m.q.options[m.q.answer] : m.q.answers[0];
      return `<div class="miss duo-stack duo-stack--tight">` +
        `<div class="duo-muted" style="font-size: var(--duo-text-sm)">${esc(m.q.prompt)}</div>` +
        `<div class="duo-fix">` +
          `<span class="duo-fix__wrong">${esc(m.given || '(blank)')}</span>` +
          `<span class="duo-fix__arrow">-&gt;</span>` +
          `<span class="duo-fix__right">${esc(model)}</span>` +
        `</div></div>`;
    }).join('');
}

$('quitBtn').onclick = toLessons;
$('secondaryBtn').onclick = toLessons;
$('actionBtn').onclick = () => {
  if (phase === 'start' || phase === 'retry') startQuiz();
  else if (phase === 'answer') check();
  else nextQuestion();
};

document.addEventListener('keyup', e => { if (e.key === 'Enter') enterLocked = false; });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (enterLocked || $('actionBtn').disabled) return;
    e.preventDefault();
    $('actionBtn').click();
    return;
  }
  if (e.key === 'Escape') {
    if (phase !== 'start') { e.preventDefault(); toLessons(); }
    return;
  }
  // Selection keys act only while a choice question awaits an answer; rewrite
  // questions have no options, so digits typed into the input fall through here.
  if (phase !== 'answer') return;
  const opts = [...$('qbody').querySelectorAll('.duo-option')];
  if (!opts.length) return;
  if (/^[1-9]$/.test(e.key)) {
    const i = +e.key - 1;
    if (i < opts.length) { e.preventDefault(); select(i, $('qbody')); }
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const d = e.key === 'ArrowDown' ? 1 : -1;
    select(selected < 0 ? (d === 1 ? 0 : opts.length - 1) : (selected + d + opts.length) % opts.length, $('qbody'));
  }
});

fit();
// Again once fonts and layout have settled: the first pass can measure short.
window.addEventListener('load', fit);
window.addEventListener('resize', fit);
</script>
</body>
</html>
