<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Coach</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="duo.css">
<style>
/* Page-specific composition. Anything reusable belongs in duo.css instead. */
* { box-sizing: border-box; }

body {
  min-height: 100vh;
  margin: 0;
  padding: var(--duo-space-4);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--duo-space-4);
  background: var(--duo-bg);
  color: var(--duo-text);
  font-family: var(--duo-font);
  font-size: var(--duo-text-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.topbar {
  width: 100%;
  max-width: var(--duo-shell-width);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--duo-space-3);
  flex-wrap: wrap;
}

.brand { font-size: var(--duo-text-lg); font-weight: var(--duo-weight-heavy); }

.tabs { display: flex; gap: var(--duo-space-2); }

.tab {
  font-size: var(--duo-text-sm);
  font-weight: var(--duo-weight-heavy);
  text-transform: uppercase;
  letter-spacing: var(--duo-tracking);
  color: var(--duo-text-muted);
  text-decoration: none;
  padding: var(--duo-space-1) var(--duo-space-3);
  border-radius: var(--duo-radius-pill);
}
.tab:hover { color: var(--duo-text); }
.tab.is-active { color: var(--duo-info-ink); background: var(--duo-info-soft); }
.tab:focus-visible { outline: 3px solid var(--duo-info); outline-offset: 2px; }

/* Per-view layout: the list and progress views flow top-down under the tab bar;
   only the quiz view centers its fixed-height card in the leftover viewport
   (the place-items trap from PR #24 - centering must never grab tall flows).
   align-content, not place-items: the shell must still stretch to the full
   shell width, which justify-items: center would shrink to fit its content. */
.view { width: 100%; max-width: var(--duo-shell-width); }
body[data-view="drill"] .view { flex: 1; display: grid; align-content: center; }

/* ---------- quiz view (ported from the drill template) ---------- */

/* One height for every screen, measured by fit(): the footer button must land on
   the same pixel whichever screen is showing. */
.duo-shell__body { height: var(--drill-body-h, 420px); }

.screen { flex: 1; display: flex; flex-direction: column; gap: var(--duo-space-3); }

.bytopic { list-style: none; padding: 0; margin: 0; }
.bytopic li {
  display: flex;
  justify-content: space-between;
  font-weight: var(--duo-weight-bold);
  padding: var(--duo-space-2) 0;
  border-bottom: var(--duo-stroke) solid var(--duo-border);
}

.miss { padding: var(--duo-space-2) 0; border-top: var(--duo-stroke) solid var(--duo-border); }
.trophy { font-size: var(--duo-space-6); line-height: 1; text-align: center; }

.session {
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--duo-text);
  background: var(--duo-surface);
  border: var(--duo-stroke) solid var(--duo-border);
  border-bottom-width: var(--duo-lift);
  border-radius: var(--duo-radius-lg);
  padding: var(--duo-space-3);
  display: flex;
  flex-direction: column;
  gap: var(--duo-space-2);
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
}
.session:hover { background: var(--duo-info-soft); }
.session:focus-visible { outline: 3px solid var(--duo-info); outline-offset: 2px; }

.session__top { display: flex; align-items: center; gap: var(--duo-space-2); flex-wrap: wrap; }
.session__date { font-weight: var(--duo-weight-bold); }
.session__score { margin-left: auto; font-weight: var(--duo-weight-heavy); color: var(--duo-brand-ink); }

.kind {
  font-size: var(--duo-text-xs);
  font-weight: var(--duo-weight-heavy);
  text-transform: uppercase;
  letter-spacing: var(--duo-tracking);
  border-radius: var(--duo-radius-pill);
  padding: var(--duo-space-1) var(--duo-space-2);
}
.kind--drill { color: var(--duo-brand-ink); background: var(--duo-brand-soft); }
.kind--learn { color: var(--duo-info-ink); background: var(--duo-info-soft); }

.cmd {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: var(--duo-text-sm);
  background: var(--duo-bg);
  border: var(--duo-stroke) solid var(--duo-border);
  border-radius: var(--duo-radius-sm);
  padding: var(--duo-space-2) var(--duo-space-3);
  overflow-x: auto;
  white-space: nowrap;
}
</style>
</head>
<body data-view="drills">

<header class="topbar">
  <div class="brand">Grammar Coach</div>
  <nav class="tabs" aria-label="Views">
    <a class="tab is-active" id="tab-drills" href="#drills">Drills</a>
    <a class="tab" id="tab-progress" href="#progress">Progress</a>
  </nav>
</header>

<main class="view" id="view-drills">
  <div class="duo-stack duo-stack--loose" id="drillsList"></div>
</main>

<main class="view duo-hidden" id="view-drill">
  <section class="duo-shell" id="drillShell">
    <header class="duo-shell__header">
      <button class="duo-icon-btn duo-hidden" id="quitBtn" title="Back to lessons" aria-label="Back to lessons">&times;</button>
      <div class="duo-progress"><div class="duo-progress__fill" id="fill"></div></div>
    </header>

    <div class="duo-shell__body" id="drillBody">

      <section class="screen" id="lessons">
        <div class="duo-stack duo-stack--tight">
          <h1 class="duo-title" id="drillTitle">Grammar Drill</h1>
          <div class="duo-muted" id="drillDate"></div>
          <div class="duo-muted" style="font-size: var(--duo-text-sm)">Keyboard: number keys or &uarr;/&darr; pick an answer &middot; Enter checks &middot; Esc goes back</div>
        </div>
        <div class="duo-row" id="chips"></div>
        <div class="duo-stack duo-stack--loose" id="topics"></div>
      </section>

      <section class="screen duo-hidden" id="quiz">
        <div class="duo-eyebrow" id="qtopic"></div>
        <h2 class="duo-prompt" id="qprompt"></h2>
        <div class="duo-stack" id="qbody"></div>
        <div class="duo-feedback duo-bottom duo-hidden" id="feedback"></div>
      </section>

      <section class="screen duo-hidden" id="result">
        <div class="trophy" id="trophy">&#127942;</div>
        <h2 class="duo-title" style="text-align: center" id="resultTitle"></h2>
        <div class="duo-row">
          <div class="duo-stat duo-stat--info">
            <div class="duo-stat__cap">Accuracy</div>
            <div class="duo-stat__value" id="statAcc"></div>
          </div>
          <div class="duo-stat">
            <div class="duo-stat__cap">First try</div>
            <div class="duo-stat__value" id="statScore"></div>
          </div>
        </div>
        <div class="duo-muted duo-hidden" style="text-align: center; font-size: var(--duo-text-sm)" id="prevAttempt"></div>
        <div class="duo-feedback duo-feedback--bad duo-hidden" id="saveNotice"></div>
        <ul class="bytopic" id="byTopic"></ul>
        <div id="misses"></div>
      </section>

    </div>

    <footer class="duo-shell__footer">
      <button class="duo-btn duo-btn--ghost duo-hidden" id="secondaryBtn">Lessons</button>
      <button class="duo-btn duo-btn--wide" id="actionBtn">Start quiz</button>
    </footer>
  </section>

  <div class="duo-hidden" id="drillError"></div>
</main>

<main class="view duo-hidden" id="view-progress">
  <div class="duo-card duo-stack" id="progressPane">
    <h2 class="duo-heading">Progress</h2>
    <p class="duo-muted" style="margin: 0">The chart view lands here in an upcoming update.</p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; };
const RESTART_CMD = 'python3 $GRAMMAR_HOME/dashboard/server.py';

async function fetchJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) {
    // status marks an answering server, which separates "drill gone" from "server gone".
    const err = new Error(`${url}: ${resp.status}`);
    err.status = resp.status;
    throw err;
  }
  return resp.json();
}

function serverGoneMarkup() {
  return `<div class="duo-card duo-stack" data-state="server-gone">
    <h2 class="duo-heading">Server gone</h2>
    <p style="margin: 0">The dashboard server is not answering. Restart it from a terminal, then reload this page:</p>
    <div class="cmd">${RESTART_CMD}</div>
  </div>`;
}

/* ---------- drills list ---------- */

function lastResultByDrill(results) {
  const map = new Map();
  results.forEach(r => { if (r && typeof r.drill === 'string') map.set(r.drill, r); });
  return map;
}

function sessionCard(d, last) {
  const kind = d.kind === 'learn' ? 'learn' : 'drill';
  const chips = (d.topics || []).map(t =>
    `<span class="duo-chip">${esc(t.label ?? '?')} &middot; ${t.count ? t.count + ' logged' : 'new topic'}</span>`).join('');
  const score = last ? `<span class="session__score">${last.correct} / ${last.total}</span>` : '';
  return `<button class="session" data-file="${esc(d.file)}">
    <div class="session__top">
      <span class="kind kind--${kind}">${kind}</span>
      <span class="session__date">${esc(d.date || d.file)}</span>
      ${score}
    </div>
    <div class="duo-row">${chips}</div>
  </button>`;
}

async function loadDrills() {
  const list = $('drillsList');
  let drills, results;
  try {
    [drills, results] = await Promise.all([fetchJSON('/api/drills'), fetchJSON('/api/results')]);
  } catch (e) {
    list.innerHTML = serverGoneMarkup();
    return;
  }
  if (!drills.length) {
    list.innerHTML = `<div class="duo-card duo-stack" data-state="empty">
      <h2 class="duo-heading">No drills yet</h2>
      <p class="duo-muted" style="margin: 0">Authored drills and lessons will show up here. Ask Claude for a grammar drill or a new lesson to create the first one.</p>
    </div>`;
    return;
  }
  const lasts = lastResultByDrill(results);
  list.innerHTML = drills.map(d => sessionCard(d, lasts.get(d.file))).join('');
}

$('drillsList').addEventListener('click', e => {
  const card = e.target.closest('.session');
  if (card) location.hash = '#drill=' + encodeURIComponent(card.dataset.file);
});

/* ---------- drill view: lessons, quiz machine, result ---------- */

// DATA is the drill JSON currently loaded into the quiz machine; loadedFile is the
// file it came from. Keeping both means a tab switch and a return does not reset a
// quiz in progress - the issue #26 core flow - while a different file reloads.
// lastResult is the newest recorded attempt at loadedFile, shown on the result
// screen as the previous score and replaced by each successful POST.
let DATA = null, loadedFile = null, wantedFile = null, lastResult = null;

const topicLabel = id => (DATA.topics.find(t => t.id === id) || { label: id }).label;

async function loadLastResult(file) {
  try {
    return (await fetchJSON('/api/results')).filter(r => r && r.drill === file).pop() || null;
  } catch (e) {
    return null;
  }
}

async function showDrill(file) {
  wantedFile = file;
  if (DATA && loadedFile === file) { fit(); return; }
  DATA = null; loadedFile = null; lastResult = null;
  let data, prev;
  try {
    [data, prev] = await Promise.all([fetchJSON('/api/drills/' + encodeURIComponent(file)), loadLastResult(file)]);
  } catch (e) {
    if (wantedFile === file) showDrillError(file, e);
    return;
  }
  if (wantedFile !== file) return;
  DATA = data; loadedFile = file; lastResult = prev;
  $('drillError').classList.add('duo-hidden');
  $('drillShell').classList.remove('duo-hidden');
  renderLessons();
  toLessons();
  fit();
}

function showDrillError(file, err) {
  $('drillShell').classList.add('duo-hidden');
  const pane = $('drillError');
  pane.classList.remove('duo-hidden');
  pane.innerHTML = err.status
    ? `<div class="duo-card duo-stack" data-state="drill-missing">
        <h2 class="duo-heading">Drill not found</h2>
        <p style="margin: 0">The server has no drill named ${esc(file)}.</p>
        <button class="duo-btn duo-btn--ghost" data-back>Back to drills</button>
      </div>`
    : serverGoneMarkup();
}

$('drillError').addEventListener('click', e => {
  if (e.target.closest('[data-back]')) location.hash = '#drills';
});

function renderLessons() {
  $('drillTitle').textContent = DATA.kind === 'learn' ? 'New Lesson' : 'Grammar Drill';
  $('drillDate').textContent = DATA.date || '';
  $('chips').innerHTML = DATA.topics
    .map(t => `<span class="duo-chip">${esc(t.label)} &middot; ${t.count ? t.count + ' logged' : 'new topic'}</span>`)
    .join('');
  $('topics').innerHTML = DATA.topics.map(t => `
    <div class="duo-card duo-stack">
      <h2 class="duo-heading">${esc(t.label)}</h2>
      <p style="margin: 0">${esc(t.lesson.summary)}</p>
      <div class="duo-stack">${t.lesson.examples.map(e => `
        <div class="duo-stack duo-stack--tight">
          <div class="duo-fix">
            <span class="duo-fix__wrong">${esc(e.wrong)}</span>
            <span class="duo-fix__arrow">-&gt;</span>
            <span class="duo-fix__right">${esc(e.right)}</span>
          </div>
          <div class="duo-muted" style="font-size: var(--duo-text-sm)">${esc(e.note)}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ---------- sizing ----------
 * The body height is fixed to the tallest question screen so the footer button
 * never moves across the quiz. Only questions are measured: the lessons and
 * result screens can be much taller, so they scroll inside the body (overflow-y)
 * rather than stretching every question to their height and leaving a dead gap.
 * Questions are measured with their feedback panel included, since that panel
 * appears inside the body. The available height comes from the view container's
 * top edge, not the whole viewport: the tab bar sits above it.
 */

function screenMarkup(el, inner) {
  const c = el.cloneNode(inner === undefined);
  c.removeAttribute('id');
  c.classList.remove('duo-hidden');
  if (inner !== undefined) c.innerHTML = inner;
  return c.outerHTML;
}

function bodyHeightFor(markup) {
  const probe = $('drillBody').cloneNode(false);
  probe.removeAttribute('id');
  probe.style.cssText =
    `position: absolute; left: 0; top: 0; visibility: hidden;` +
    `height: auto; width: ${$('drillBody').offsetWidth}px;`;
  probe.innerHTML = markup;
  $('drillShell').appendChild(probe);
  const h = probe.scrollHeight;
  probe.remove();
  return h;
}

function questionMarkup(q) {
  return screenMarkup($('quiz'),
    `<div class="duo-eyebrow">${esc(topicLabel(q.topic))}</div>` +
    `<h2 class="duo-prompt">${esc(q.prompt)}</h2>` +
    `<div class="duo-stack">` +
      (q.type === 'choice'
        ? q.options.map((o, i) => `<button class="duo-option"><span class="duo-key">${i + 1}</span><span>${esc(o)}</span></button>`).join('')
        : '<input class="duo-input">') +
    `</div>` +
    `<div class="duo-feedback duo-bottom">` +
      `<div class="duo-feedback__title">x Not quite</div>` +
      `<div class="duo-feedback__answer">${esc(q.type === 'choice' ? q.options[q.answer] : q.answers[0])}</div>` +
      `<div class="duo-feedback__note">${esc(q.explain)}</div>` +
    `</div>`);
}

function fit() {
  if (!DATA || document.body.dataset.view !== 'drill') return;
  let need = 0;
  DATA.questions.forEach(q => { need = Math.max(need, bodyHeightFor(questionMarkup(q))); });
  const shell = $('drillShell');
  const chrome = shell.offsetHeight - $('drillBody').offsetHeight;
  const viewTop = $('view-drill').getBoundingClientRect().top;
  const pagePad = parseFloat(getComputedStyle(document.body).paddingBottom);
  const avail = window.innerHeight - viewTop - pagePad - chrome;
  document.documentElement.style.setProperty(
    '--drill-body-h', `${Math.max(240, Math.min(need, avail))}px`);
}

/* ---------- quiz ---------- */

// queue holds question indices still to ask; a missed question is pushed back on
// so it returns later in the same run. retired = answered right at least once,
// which is what the progress bar measures (the queue length is not fixed).
let queue = [], current = -1, retired = new Set(), firstTry = new Map(), misses = [];
let selected = -1, phase = 'start', enterLocked = false, posted = false;

const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const normalize = s => s.toLowerCase().replace(/[.!?]+\s*$/, '').replace(/\s+/g, ' ').trim();

function show(screen) {
  ['lessons', 'quiz', 'result'].forEach(id => $(id).classList.toggle('duo-hidden', id !== screen));
  $('quitBtn').classList.toggle('duo-hidden', screen !== 'quiz');
  $('drillBody').scrollTop = 0;
}

function setAction(label, { danger = false, disabled = false, secondary = false } = {}) {
  const btn = $('actionBtn');
  btn.textContent = label;
  btn.className = 'duo-btn duo-btn--wide' + (danger ? ' duo-btn--danger' : '');
  btn.disabled = disabled;
  $('secondaryBtn').classList.toggle('duo-hidden', !secondary);
}

function setProgress(pct) { $('fill').style.width = `${pct}%`; }

function toLessons() {
  show('lessons');
  setProgress(0);
  phase = 'start';
  setAction('Start quiz');
}

function startQuiz() {
  queue = shuffle(DATA.questions.map((_, i) => i));
  retired = new Set(); firstTry = new Map(); misses = [];
  // Each run POSTs once; the flag reopens here so a retry records its own result.
  posted = false;
  nextQuestion();
}

function nextQuestion() {
  if (!queue.length) return showResult();
  show('quiz');
  current = queue.shift();
  selected = -1;
  phase = 'answer';
  const q = DATA.questions[current];
  setProgress(Math.round(100 * retired.size / DATA.questions.length));
  $('qtopic').textContent = topicLabel(q.topic);
  $('qprompt').textContent = q.prompt;
  $('feedback').classList.add('duo-hidden');
  setAction('Check', { disabled: true });

  const body = $('qbody');
  body.innerHTML = '';
  if (q.type === 'choice') {
    q.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'duo-option';
      const key = document.createElement('span');
      key.className = 'duo-key';
      key.textContent = i + 1;
      const label = document.createElement('span');
      label.textContent = opt;
      b.append(key, label);
      b.onclick = () => select(i, body);
      body.appendChild(b);
    });
  } else {
    const inp = document.createElement('input');
    inp.className = 'duo-input';
    inp.id = 'rewriteInput';
    inp.placeholder = 'Type the corrected sentence';
    inp.oninput = () => { $('actionBtn').disabled = !inp.value.trim(); };
    body.appendChild(inp);
    inp.focus();
  }
}

function select(i, body) {
  selected = i;
  [...body.children].forEach((b, j) => b.classList.toggle('is-selected', j === i));
  $('actionBtn').disabled = false;
}

function check() {
  const q = DATA.questions[current];
  let ok, given;
  if (q.type === 'choice') {
    given = q.options[selected];
    ok = selected === q.answer;
    [...$('qbody').children].forEach((b, j) => {
      b.disabled = true;
      b.classList.remove('is-selected');
      if (j === q.answer) b.classList.add('is-correct');
      else if (j === selected) b.classList.add('is-wrong');
    });
  } else {
    const inp = $('rewriteInput');
    given = inp.value;
    ok = q.answers.some(a => normalize(a) === normalize(given));
    inp.disabled = true;
  }

  if (!firstTry.has(current)) {
    firstTry.set(current, ok);
    if (!ok) misses.push({ q, given });
  }
  if (ok) retired.add(current);
  else queue.push(current);

  const model = q.type === 'choice' ? q.options[q.answer] : q.answers[0];
  const fb = $('feedback');
  fb.className = 'duo-feedback duo-bottom' + (ok ? '' : ' duo-feedback--bad');
  fb.innerHTML =
    `<div class="duo-feedback__title">${ok ? '&#10004; Nice!' : '&#10006; Not quite'}</div>` +
    (ok ? '' : `<div class="duo-feedback__answer">${esc(model)}</div>`) +
    `<div class="duo-feedback__note">${esc(q.explain)}</div>`;

  setAction(queue.length ? 'Continue' : 'See result', { danger: !ok });
  phase = 'continue';
  // A held Enter would otherwise fire Check and Continue back to back, wiping the
  // feedback before it can be read. Unlock only on the next keyup.
  enterLocked = true;
  setProgress(Math.round(100 * retired.size / DATA.questions.length));
}

function showResult() {
  show('result');
  setProgress(100);
  phase = 'retry';
  setAction('Try again', { secondary: true });

  const total = DATA.questions.length;
  const good = [...firstTry.values()].filter(Boolean).length;
  const pct = Math.round(100 * good / total);
  $('statAcc').textContent = `${pct}%`;
  $('statScore').textContent = `${good} / ${total}`;
  $('trophy').innerHTML = pct === 100 ? '&#127942;' : pct >= 60 ? '&#127881;' : '&#128170;';
  $('resultTitle').textContent = pct === 100 ? 'Flawless' : pct >= 60 ? 'Lesson complete' : 'Keep drilling';

  const per = {};
  DATA.questions.forEach((q, i) => {
    if (!firstTry.has(i)) return;
    per[q.topic] = per[q.topic] || { good: 0, total: 0 };
    per[q.topic].total++;
    if (firstTry.get(i)) per[q.topic].good++;
  });
  $('byTopic').innerHTML = Object.entries(per)
    .map(([t, s]) => `<li><span>${esc(topicLabel(t))}</span><span>${s.good} / ${s.total}</span></li>`).join('');

  // Read before saving: the POST below replaces lastResult with this run's score.
  const prev = lastResult;
  $('prevAttempt').classList.toggle('duo-hidden', !prev);
  if (prev) {
    const when = typeof prev.ts === 'string' ? prev.ts.slice(0, 10) : '';
    $('prevAttempt').textContent = `Previous attempt: ${prev.correct} / ${prev.total}${when ? ' on ' + when : ''}`;
  }
  saveResult({ ts: localISO(), drill: loadedFile, total, correct: good, byTopic: per });

  $('misses').innerHTML = misses.length === 0 ? '' :
    `<h3 class="duo-heading">Review</h3>` + misses.map(m => {
      const model = m.q.type === 'choice' ? m.q.options[m.q.answer] : m.q.answers[0];
      return `<div class="miss duo-stack duo-stack--tight">` +
        `<div class="duo-muted" style="font-size: var(--duo-text-sm)">${esc(m.q.prompt)}</div>` +
        `<div class="duo-fix">` +
          `<span class="duo-fix__wrong">${esc(m.given || '(blank)')}</span>` +
          `<span class="duo-fix__arrow">-&gt;</span>` +
          `<span class="duo-fix__right">${esc(model)}</span>` +
        `</div></div>`;
    }).join('');
}

// Offset-carrying timestamp, matching history.jsonl: the date a result belongs to
// is the local one, which a UTC toISOString() shifts either side of midnight.
function localISO(d = new Date()) {
  const p = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
  const off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}` +
    `T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` +
    `${off < 0 ? '-' : '+'}${p(off / 60)}:${p(off % 60)}`;
}

async function saveResult(payload) {
  if (posted) return;
  posted = true;
  const notice = $('saveNotice');
  notice.classList.add('duo-hidden');
  try {
    const resp = await fetch('/api/results', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error(String(resp.status));
    lastResult = payload;
  } catch (e) {
    notice.innerHTML =
      `<div class="duo-feedback__title">Result not saved</div>` +
      `<div class="duo-feedback__note">The server did not accept it (${esc(e.message)}). Restart it and run the quiz again to record a score:</div>` +
      `<div class="cmd" style="margin-top: var(--duo-space-2)">${RESTART_CMD}</div>`;
    notice.classList.remove('duo-hidden');
  }
}

$('quitBtn').onclick = toLessons;
$('secondaryBtn').onclick = toLessons;
$('actionBtn').onclick = () => {
  if (phase === 'start' || phase === 'retry') startQuiz();
  else if (phase === 'answer') check();
  else nextQuestion();
};

/* Key handling is document-level and dereferences quiz-only nodes, so every
   handler is gated on the quiz view owning the screen with a drill loaded:
   on the list and progress views the keys must be inert. */
const quizActive = () => document.body.dataset.view === 'drill' && !!DATA;

document.addEventListener('keyup', e => { if (e.key === 'Enter') enterLocked = false; });
document.addEventListener('keydown', e => {
  if (!quizActive()) return;
  if (e.key === 'Enter') {
    if (enterLocked || $('actionBtn').disabled) return;
    e.preventDefault();
    $('actionBtn').click();
    return;
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    // One step back per press: quiz or result -> this drill's lessons, lessons -> the list.
    if (phase === 'start') location.hash = '#drills';
    else toLessons();
    return;
  }
  // Selection keys act only while a choice question awaits an answer; rewrite
  // questions have no options, so digits typed into the input fall through here.
  if (phase !== 'answer') return;
  const opts = [...$('qbody').querySelectorAll('.duo-option')];
  if (!opts.length) return;
  if (/^[1-9]$/.test(e.key)) {
    const i = +e.key - 1;
    if (i < opts.length) { e.preventDefault(); select(i, $('qbody')); }
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const d = e.key === 'ArrowDown' ? 1 : -1;
    select(selected < 0 ? (d === 1 ? 0 : opts.length - 1) : (selected + d + opts.length) % opts.length, $('qbody'));
  }
});

// Again once fonts and layout have settled: the first pass can measure short.
window.addEventListener('load', fit);
window.addEventListener('resize', fit);

/* ---------- hash router ---------- */

function route() {
  const h = location.hash;
  let view = 'drills', arg = null;
  if (h.startsWith('#drill=')) { view = 'drill'; arg = decodeURIComponent(h.slice('#drill='.length)); }
  else if (h === '#progress') view = 'progress';
  document.body.dataset.view = view;
  ['drills', 'drill', 'progress'].forEach(v => $('view-' + v).classList.toggle('duo-hidden', v !== view));
  $('tab-drills').classList.toggle('is-active', view !== 'progress');
  $('tab-progress').classList.toggle('is-active', view === 'progress');
  if (view === 'drill') showDrill(arg);
  else {
    wantedFile = null;
    if (view === 'drills') loadDrills();
  }
}

window.addEventListener('hashchange', route);
route();
</script>
